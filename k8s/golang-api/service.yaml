apiVersion: v1
kind: Service
metadata:
  name: golang-api
  namespace: golang-api
  labels:
    app: golang-api
  annotations:
    # Azure-specific: provision an internal load balancer (remove to get a public IP)
    # service.beta.kubernetes.io/azure-load-balancer-internal: "true"
spec:
  selector:
    app: golang-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  # LoadBalancer provisions an Azure public IP via the cloud controller
  type: LoadBalancer
