version: "2.0"
services:

 golang-api:
  build:
   context: .
   dockerfile: Dockerfile
  image: golang-api:latest
  ports:
   - "8080:8080"
  volumes:
   - /home/adeel/Desktop/git/golang-api/:/app
  depends_on:
   - mysql 
 mysql:
  build:
   context: .
   dockerfile: DockerfileMySQL
  image: golang-mysql:latest
  environment:
  - MYSQL_DATABASE=language
  - MYSQL_ROOT_PASSWORD=changeme
  - MYSQL_USER=dbuser
  - MYSQL_PASSWORD=changeme
  ports:
   - "3306:3306" 