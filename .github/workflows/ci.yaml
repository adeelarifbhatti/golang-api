name: CI
on:
  push:
  workflow_dispatch:
env:
  DB_NAME: testing
jobs: 
  run_code_checks:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v2
    - name: set up Mysql
      run: |
        sudo /etc/init.d/mysql start
        echo "127.0.0.1    mysql"| sudo tee -a /etc/hosts
        sudo mysql -e 'create database language;' -uroot -proot
        echo "source init-script.sql" | mysql -u root -proot -D language
        sudo mysql -e 'Alter user "root"@"localhost" identified by "changeme";' -uroot -proot
    - name: Set up Go
      uses: actions/setup-go@v2
      with:
        go-version: 1.21
    - name: compiling
      run: go build
    - name: running the tests
      run: go test

  push_docker_images:
    needs: run_code_checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push golang-api image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_GO_IMAGE_NAME }}:latest
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_GO_IMAGE_NAME}}:${{ github.sha }}

      - name: Build and push mysql image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./DockerfileMySQL
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_MYSQL_IMAGE_NAME }}:latest
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_MYSQL_IMAGE_NAME}}:${{ github.sha }}

  deploy_to_aks:
    name: Deploy to AKS
    needs: push_docker_images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      ACR_LOGIN_SERVER: ${{ secrets.ACR_REGISTRY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Substitute image placeholders in manifests
        run: |
          find k8s -name "*.yaml" -exec sed -i \
            -e "s|ACR_LOGIN_SERVER|${{ env.ACR_LOGIN_SERVER }}|g" \
            -e "s|IMAGE_TAG|${{ github.sha }}|g" \
            {} +

      - name: Apply namespace
        run: kubectl apply -f k8s/namespace.yaml

      - name: Apply MySQL manifests
        run: kubectl apply -f k8s/mysql/

      - name: Wait for MySQL to be ready
        run: kubectl rollout status deployment/mysql -n golang-api --timeout=120s

      - name: Apply golang-api manifests
        run: kubectl apply -f k8s/golang-api/

      - name: Wait for golang-api rollout
        run: kubectl rollout status deployment/golang-api -n golang-api --timeout=120s

