name: CI
on:
  push:
  workflow_dispatch:
env:
  DB_NAME: testing
jobs: 
  run_code_checks:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v2
    - name: set up Mysql
      run: |
        sudo /etc/init.d/mysql start
        echo "127.0.0.1    mysql"| sudo tee -a /etc/hosts
        sudo mysql -e 'create database language;' -uroot -proot
        echo "source init-script.sql" | mysql -u root -proot -D language
        sudo mysql -e 'Alter user "root"@"localhost" identified by "changeme";' -uroot -proot
    - name: Set up Go
      uses: actions/setup-go@v2
      with:
        go-version: 1.21
    - name: compiling
      run: go build
    - name: running the tests
      run: go test

  push_docker_images:
    needs: run_code_checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: myazurecontainerregistry1212.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push golang-api image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            myazurecontainerregistry1212.azurecr.io/golang-api:latest
            myazurecontainerregistry1212.azurecr.io/golang-api:${{ github.sha }}

      - name: Build and push mysql image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./DockerfileMySQL
          push: true
          tags: |
            myazurecontainerregistry1212.azurecr.io/mysql:latest
            myazurecontainerregistry1212.azurecr.io/mysql:${{ github.sha }}
